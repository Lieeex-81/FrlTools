owser.\",saveFail:\"Could not save.\"}\n};\nvar LANG=\"id\";\ntry{\n  var sl=localStorage.getItem(\"penghitung-ban-lang\");\n  if(sl===\"id\"||sl===\"en\"){LANG=sl}\n  else if(navigator.language&&navigator.language.slice(0,2)!==\"id\"){LANG=\"en\"}\n}catch(e){}\nfunction t(k,v){var s=T[LANG][k];if(v)for(var x in v)s=s.replace(\"{\"+x+\"}\",v[x]);return s}\nfunction tiresTxt(n){return LANG===\"en\"?n+(n===1?\" tire\":\" tires\"):n+\" ban\"}\n\nvar TYPES={hard:{n:\"Hard\",c:\"#ffffff\"},medium:{n:\"Medium\",c:\"#ffd21f\"},soft:{n:\"Soft\",c:\"#ff2d2d\"}};\nvar KEYS=Object.keys(TYPES);\nvar people=[];\nfunction find(name){return people.filter(function(p){return p.name.toLowerCase()===name.toLowerCase()})[0]}\ntry{\n  var v=localStorage.getItem(\"penghitung-ban-v2\");\n  if(v){people=JSON.parse(v)}\n  else{\n    JSON.parse(localStorage.getItem(\"penghitung-ban\")||\"[]\").forEach(function(it){\n      var p=find(it.name);\n      if(!p){p={name:it.name,c:{hard:0,medium:0,soft:0}};people.push(p)}\n      p.c[it.type]+=it.qty;\n    });\n  }\n}catch(e){people=[]}\nfunction save(){\n  var ok=true;\n  try{localStorage.setItem(\"penghitung-ban-v2\",JSON.stringify(people));localStorage.setItem(\"penghitung-ban-extra\",EXTRA)}catch(e){ok=false}\n  if(CLOUD){setStatus(\"saving\");clearTimeout(timer);timer=setTimeout(pushCloud,500)}\n  else{setStatus(ok?\"savedLocal\":\"saveFail\")}\n}\nfunction el(tg,cls,txt){var e=document.createElement(tg);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}\nfunction dot(k,s){\n  s=s||26;\n  var NS=\"http://www.w3.org/2000/svg\",col=TYPES[k].c;\n  var svg=document.createElementNS(NS,\"svg\");\n  svg.setAttribute(\"viewBox\",\"0 0 100 100\");svg.setAttribute(\"width\",s);svg.setAttribute(\"height\",s);\n  svg.setAttribute(\"class\",\"tire\");svg.setAttribute(\"aria-hidden\",\"true\");\n  if(s>30){svg.style.display=\"block\";svg.style.margin=\"0 auto 4px\"}else{svg.style.marginRight=\"8px\"}\n  function add(tg,a){var e=document.createElementNS(NS,tg);for(var i in a)e.setAttribute(i,a[i]);svg.appendChild(e)}\n  add(\"circle\",{cx:50,cy:50,r:48,fill:\"#2b2b2b\",stroke:\"#7a7a7a\",\"stroke-width\":2});\n  add(\"path\",{d:\"M33.1 18.2A36 36 0 0 0 33.1 81.8\",fill:\"none\",stroke:col,\"stroke-width\":8});\n  add(\"path\",{d:\"M66.9 18.2A36 36 0 0 1 66.9 81.8\",fill:\"none\",stroke:col,\"stroke-width\":8});\n  add(\"circle\",{cx:50,cy:50,r:25,fill:\"#8c8c8c\"});\n  for(var n=0;n\u003c8;n++){var g=n*Math.PI/4;add(\"line\",{x1:50+7*Math.cos(g),y1:50+7*Math.sin(g),x2:50+19*Math.cos(g),y2:50+19*Math.sin(g),stroke:\"#fff\",\"stroke-width\":4})}\n  add(\"circle\",{cx:50,cy:50,r:7,fill:\"#fff\"});\n  return svg;\n}\nfunction sumOf(p){return KEYS.reduce(function(a,k){return a+p.c[k]},0)}\nfunction lines(){\n  return people.map(function(p){\n    var s=KEYS.filter(function(k){return p.c[k]>0}).map(function(k){return TYPES[k].n+\" \"+p.c[k]+\"x\"}).join(\" \");\n    return p.name+(s?\" \"+s:\" (\"+t(\"noTires\")+\")\");\n  });\n}\nfunction rekap(){\n  var box=document.getElementById(\"rekap\");box.innerHTML=\"\";\n  var h=el(\"div\",\"rtitle\");\n  h.appendChild(el(\"span\",\"rt\",\"Tyre Component Used\"));\n  var xi=el(\"input\");xi.type=\"text\";xi.maxLength=80;xi.value=EXTRA;\n  xi.placeholder=t(\"extraPh\");xi.setAttribute(\"aria-label\",t(\"extraPh\"));\n  xi.oninput=function(){EXTRA=xi.value;save()};\n  h.appendChild(xi);box.appendChild(h);\n  if(!people.length){box.appendChild(el(\"div\",\"empty\",t(\"noData\")));return}\n  people.forEach(function(p,n){\n    var r=el(\"div\",\"rline\");\n    r.appendChild(el(\"span\",\"rno\",n+1));\n    r.appendChild(el(\"span\",\"rname\",p.name));\n    KEYS.forEach(function(k){\n      var c=el(\"span\",\"rchip\");\n      if(p.c[k]>0){\n        var di=dot(k,22);di.style.margin=\"0 6px 0 0\";\n        c.setAttribute(\"aria-label\",TYPES[k].n+\" \"+p.c[k]);\n        c.appendChild(di);c.appendChild(document.createTextNode(p.c[k]));\n      }\n      r.appendChild(c);\n    });\n    box.appendChild(r);\n  });\n}\nfunction render(){\n  rekap();\n  var sum=document.getElementById(\"sum\");sum.innerHTML=\"\";\n  var all=0;\n  KEYS.forEach(function(k){\n    var n=people.reduce(function(a,p){return a+p.c[k]},0);\n    all+=n;\n    var c=el(\"div\",\"card\");\n    c.appendChild(dot(k,44));c.appendChild(el(\"div\",\"num\",n));\n    c.appendChild(el(\"div\",\"lbl\",TYPES[k].n));\n    sum.appendChild(c);\n  });\n  document.getElementById(\"total\").textContent=all;\n\n  var list=document.getElementById(\"list\");list.innerHTML=\"\";\n  if(!people.length){var e=el(\"div\",\"card\");e.appendChild(el(\"div\",\"empty\",t(\"empty\")));list.appendChild(e);return}\n  people.forEach(function(p){\n    var card=el(\"div\",\"card person\");\n    var h=el(\"div\",\"phead\");\n    var w=el(\"div\",\"who\");w.appendChild(el(\"b\",\"\",p.name));w.appendChild(el(\"small\",\"\",tiresTxt(sumOf(p))));\n    var d=el(\"button\",\"mini\",\"×\");d.type=\"button\";d.setAttribute(\"aria-label\",t(\"del\")+\" \"+p.name);\n    d.onclick=function(){\n      var go=function(){people=people.filter(function(x){return x!==p});save();render()};if(sumOf(p)===0){go()}else{ask(t(\"delQ\",{name:p.name}),go)}\n    };\n    h.appendChild(w);h.appendChild(d);card.appendChild(h);var grid=el(\"div\",\"tgrid\");card.appendChild(grid);\n    KEYS.forEach(function(k){\n      var r=el(\"div\",\"tcol\");\n      var ic=dot(k);ic.style.margin=\"0\";if(!p.c[k])ic.style.opacity=\".35\";r.appendChild(ic);\n      \n      var m=el(\"button\",\"mini\",\"−\");m.type=\"button\";m.setAttribute(\"aria-label\",t(\"less\")+\" \"+TYPES[k].n);\n      m.onclick=function(){if(p.c[k]>0){p.c[k]--;save();render()}};\n      var q=el(\"span\",\"cnt\"+(p.c[k]?\"\":\" zero\"),p.c[k]);\n      var a=el(\"button\",\"mini\",\"+\");a.type=\"button\";a.setAttribute(\"aria-label\",t(\"more\")+\" \"+TYPES[k].n);\n      a.onclick=function(){p.c[k]++;save();render()};\n      var ctl=el(\"div\",\"ctl\");ctl.appendChild(m);ctl.appendChild(q);ctl.appendChild(a);r.appendChild(ctl);\n      grid.appendChild(r);\n    });\n    list.appendChild(card);\n  });\n}\nfunction applyLang(){\n  document.documentElement.lang=LANG;\n  document.title=t(\"title\");\n  Array.prototype.forEach.call(document.querySelectorAll(\"[data-t]\"),function(e){e.textContent=t(e.getAttribute(\"data-t\"))});\n  document.getElementById(\"name\").placeholder=t(\"ph\");\n  document.getElementById(\"sname\").placeholder=t(\"savePh\");\n  Array.prototype.forEach.call(document.querySelectorAll(\"[data-l]\"),function(b){b.setAttribute(\"aria-pressed\",b.getAttribute(\"data-l\")===LANG)});\n  document.getElementById(\"err\").textContent=\"\";setStatus(SK);renderSaves();\n  document.getElementById(\"cmsg\").textContent=\"\";\n  render();\n}\nArray.prototype.forEach.call(document.querySelectorAll(\"[data-l]\"),function(b){\n  b.onclick=function(){LANG=b.getAttribute(\"data-l\");try{localStorage.setItem(\"penghitung-ban-lang\",LANG)}catch(e){}applyLang()};\n});\ndocument.getElementById(\"add\").onclick=function(){\n  var inp=document.getElementById(\"name\"),err=document.getElementById(\"err\");\n  var name=inp.value.trim();\n  if(!name){err.textContent=t(\"needName\");inp.focus();return}\n  if(find(name)){err.textContent=t(\"dup\");return}\n  err.textContent=\"\";\n  people.push({name:name,c:{hard:0,medium:0,soft:0}});\n  inp.value=\"\";save();render();\n};\ndocument.getElementById(\"name\").addEventListener(\"keydown\",function(e){if(e.key===\"Enter\")document.getElementById(\"add\").click()});\ndocument.getElementById(\"reset\").onclick=function(){\n  if(people.length){ask(t(\"delAllQ\"),function(){people=[];save();render()})}\n};\ndocument.getElementById(\"copy\").onclick=function(){\n  var tx=lines().join(\"\\n\"),m=document.getElementById(\"cmsg\");\n  if(!tx){m.textContent=t(\"noData\");return}\n  function ok(){m.textContent=t(\"copied\")}\n  function fb(){\n    var ta=document.createElement(\"textarea\");ta.value=tx;document.body.appendChild(ta);ta.select();\n    try{document.execCommand(\"copy\");ok()}catch(e){m.textContent=t(\"copyFail\")}\n    document.body.removeChild(ta);\n  }\n  try{navigator.clipboard.writeText(tx).then(ok,fb)}catch(e){fb()}\n};\nfunction iconPng(k){\n  return new Promise(function(res,rej){\n    var s=new XMLSerializer().serializeToString(dot(k,150));\n    var img=new Image();\n    img.onload=function(){var c=document.createElement(\"canvas\");c.width=150;c.height=150;c.getContext(\"2d\").drawImage(img,0,0,150,150);res(c.toDataURL(\"image/png\"))};\n    img.onerror=rej;\n    img.src=\"data:image/svg+xml;charset=utf-8,\"+encodeURIComponent(s);\n  });\n}\nasync function exportPdf(fn){\n  var m=document.getElementById(\"cmsg\");\n  if(!people.length){m.textContent=t(\"noData\");return}\n  await getDL();\n  if(!DL){m.textContent=t(\"dlNA\");return}\n  if(!window.jspdf){m.textContent=t(\"pdfFail\");return}\n  try{\n    var icons={};\n    for(var i=0;i\u003cKEYS.length;i++){icons[KEYS[i]]=await iconPng(KEYS[i])}\n    var doc=new window.jspdf.jsPDF({unit:\"mm\",format:\"a4\"});\n    var M=18,W=210,y=22,no=0;var BG=function(){doc.setFillColor(16,16,16);doc.rect(0,0,210,297,\"F\")};BG();\n    doc.setFont(\"helvetica\",\"bold\");doc.setFontSize(20);doc.setTextColor(212);doc.text(\"Tyre Component Used\",M,y);var tw=doc.getTextWidth(\"Tyre Component Used\");var XT=(EXTRA||\"\").trim(),XL=XT?doc.splitTextToSize(XT,W-2*M-tw-4):[];XL.forEach(function(ln,i){doc.text(ln,M+tw+4,y+i*8)});if(XL.length>1)y+=(XL.length-1)*8;\n    y+=6;doc.setDrawColor(52);doc.line(M,y,W-M,y);y+=11;\n    people.forEach(function(p){\n      doc.setFont(\"helvetica\",\"bold\");doc.setFontSize(12);var NL=doc.splitTextToSize(p.name,76);if(y+(NL.length-1)*6>278){doc.addPage();BG();y=22}no++;\n      doc.setFont(\"helvetica\",\"bold\");doc.setFontSize(12);doc.setTextColor(30);\n      doc.setTextColor(138);doc.text(String(no),M,y);doc.setTextColor(212);NL.forEach(function(ln,i){doc.text(ln,M+10,y+i*6)});var ex=(NL.length-1)*6;\n      var used=KEYS.filter(function(k){return p.c[k]>0});\n      doc.setFont(\"helvetica\",\"normal\");\n      \n      used.forEach(function(k){\n        var s=TYPES[k].n+\" \"+p.c[k]+\"x\";\n        var xx=W-M-84+KEYS.indexOf(k)*28;doc.addImage(icons[k],\"PNG\",xx,y-6,8,8);doc.setFont(\"helvetica\",\"bold\");doc.setFontSize(14);doc.setTextColor(212);doc.text(String(p.c[k]),xx+11,y);\n      });\n      y+=7+ex;doc.setDrawColor(40);doc.line(M,y,W-M,y);y+=8;\n    });\n    await DL.save({filename:fn||t(\"pdfFile\"),data:doc.output(\"blob\")});\n    m.textContent=t(\"pdfDone\");\n  }catch(e){m.textContent=(e&&e.code===\"declined\")?\"\":t(\"pdfFail\")}\n}\nfunction iconImg(k){\n  return new Promise(function(res,rej){\n    var s=new XMLSerializer().serializeToString(dot(k,150));\n    var img=new Image();\n    img.onload=function(){res(img)};\n    img.onerror=rej;\n    img.src=\"data:image/svg+xml;charset=utf-8,\"+encodeURIComponent(s);\n  });\n}\nfunction wrapText(g,text,maxW){\n  var out=[],cur=\"\";\n  text.split(\" \").forEach(function(w){\n    while(g.measureText(w).width>maxW&&w.length>1){\n      var k=w.length;\n      while(k>1&&g.measureText(w.slice(0,k)).width>maxW)k--;\n      if(cur){out.push(cur);cur=\"\"}\n      out.push(w.slice(0,k));w=w.slice(k);\n    }\n    var tst=cur?cur+\" \"+w:w;\n    if(!cur||g.measureText(tst).width\u003c=maxW){cur=tst}else{out.push(cur);cur=w}\n  });\n  out.push(cur);\n  return out;\n}\nasync function exportJpg(fn){\n  var m=document.getElementById(\"cmsg\");\n  if(!people.length){m.textContent=t(\"noData\");return}\n  await getDL();\n  if(!DL){m.textContent=t(\"dlNA\");return}\n  try{\n    var S=2,PAD=48,WD=1000,TOP=84,NX=PAD+64,NW=430,CW=130,TX=WD-PAD-3*CW,LH=34,RP=22;\n    var F=\"system-ui,-apple-system,Arial,sans-serif\";\n    var imgs={};\n    for(var i=0;i\u003cKEYS.length;i++){imgs[KEYS[i]]=await iconImg(KEYS[i])}\n    var c=document.createElement(\"canvas\"),g=c.getContext(\"2d\");\n    g.font=\"700 26px \"+F; "\";\nfunction setStatus(k){SK=k;document.getElementById(\"smsg\").textContent=k?t(k):\"\"}\nasync function pushCloud(){\n  if(!CLOUD)return;\n  if(syncing){dirty=true;return}\n  syncing=true;\n  try{\n    do{dirty=false;await CLOUD.set({people:JSON.parse(JSON.stringify(people)),extra:EXTRA})}while(dirty);\n    setStatus(\"saved\");\n  }catch(e){\n    if(e&&e.code===\"invalid_argument\"){CLOUD=null;setStatus(\"savedLocal\")}else{setStatus(\"saveFail\")}\n  }\n  syncing=false;\n}\nasync function initCloud(){\n  try{\n    if(!(window.claude&&window.claude.use))return;\n    var db=await window.claude.use(\"db\"),user=await window.claude.use(\"user\");\n    if(!db||!user)return;\n    var uid=await user.id();\n    if(!uid)return;\n    var ref=db.doc(\"data/users/\"+uid+\"/penghitung-ban\");\n    var snap=await ref.get();\n    var d=snap.exists?snap.data():null;\n    CLOUD=ref;SREF=db.doc(\"data/users/\"+uid+\"/penghitung-saves\");await loadCloudSaves();\n    if(d&&Array.isArray(d.people)){\n      people=JSON.parse(JSON.stringify(d.people));EXTRA=typeof d.extra===\"string\"?d.extra:\"\";\n      try{localStorage.setItem(\"penghitung-ban-v2\",JSON.stringify(people))}catch(e){}\n      render();\n    }else if(people.length){await pushCloud()}\n  }catch(e){}\n}\nvar SAVES=[],SREF=null;\nfunction loadLocalSaves(){try{SAVES=JSON.parse(localStorage.getItem(\"penghitung-ban-saves\")||\"[]\")}catch(e){SAVES=[]}}\nasync function persistSaves(){\n  try{localStorage.setItem(\"penghitung-ban-saves\",JSON.stringify(SAVES))}catch(e){}\n  if(SREF){try{await SREF.set({items:JSON.parse(JSON.stringify(SAVES))})}catch(e){}}\n}\nasync function loadCloudSaves(){\n  try{\n    var ss=await SREF.get(),sd=ss.exists?ss.data():null;\n    if(sd&&Array.isArray(sd.items)){\n      SAVES=JSON.parse(JSON.stringify(sd.items));\n      try{localStorage.setItem(\"penghitung-ban-saves\",JSON.stringify(SAVES))}catch(e){}\n      renderSaves();\n    }else if(SAVES.length){await persistSaves()}\n  }catch(e){SREF=null}\n}\nfunction peopleTxt(n){return LANG===\"en\"?n+(n===1?\" person\":\" people\"):n+\" orang\"}\nfunction openSave(s){\n  if(people.length){ask(t(\"openQ\",{name:s.name}),function(){doOpen(s)})}else{doOpen(s)}\n}\nfunction doOpen(s){\n  people=JSON.parse(JSON.stringify(s.people));EXTRA=s.extra||\"\";\n  document.getElementById(\"sname\").value=s.name;\n  save();render();\n  document.getElementById(\"nmsg\").textContent=t(\"opened\",{name:s.name});\n}\nfunction renderSaves(){\n  var box=document.getElementById(\"saves\");box.innerHTML=\"\";\n  if(!SAVES.length){return}\n  SAVES.forEach(function(s){\n    var r=el(\"span\",\"chip\");\n    \n    var o=el(\"button\",\"sopen\",s.name);o.type=\"button\";o.title=t(\"open\")+\" \"+s.name;\n    o.onclick=function(){openSave(s)};\n    var d=el(\"button\",\"mini\",\"×\");d.type=\"button\";d.setAttribute(\"aria-label\",t(\"del\")+\" \"+s.name);\n    d.onclick=function(){\n      ask(t(\"delSaveQ\",{name:s.name}),function(){SAVES=SAVES.filter(function(x){return x!==s});persistSaves();renderSaves()})\n    };\n    r.appendChild(o);r.appendChild(d);box.appendChild(r);\n  });\n}\nfunction ask(msg,onYes){\n  var ov=el(\"div\",\"ov\"),box=el(\"div\",\"dlg\"),row=el(\"div\",\"drow\");\n  box.setAttribute(\"role\",\"alertdialog\");\n  box.appendChild(el(\"p\",\"dmsg\",msg));\n  var no=el(\"button\",\"dno\",t(\"cancel\")),yes=el(\"button\",\"dyes\",t(\"ok\"));\n  no.type=\"button\";yes.type=\"button\";\n  function close(){if(ov.parentNode)ov.parentNode.removeChild(ov)}\n  no.onclick=close;\n  yes.onclick=function(){close();onYes()};\n  ov.onclick=function(e){if(e.target===ov)close()};\n  row.appendChild(no);row.appendChild(yes);box.appendChild(row);ov.appendChild(box);\n  document.body.appendChild(ov);yes.focus();\n}\nvar FNAME=\"\";\ntry{FNAME=localStorage.getItem(\"penghitung-ban-fname\")||\"\"}catch(e){}\nfunction askName(ext,onOk){\n  var def=t(ext+\"File\").replace(\".\"+ext,\"\");\n  var ov=el(\"div\",\"ov\"),box=el(\"div\",\"dlg\
